<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Pagina de contacto de Ivan Martinez">

  <link rel="stylesheet"
    href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
    integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/"
    crossorigin="anonymous">

  <link rel="stylesheet" href="contacto.css">

  <title>Contacto | Ivan Martinez</title>
</head>

<body>

  <main class="contact-container">

    <section class="contact-card">

      <div class="contact-header">

        <div class="profile-icon">
          <i class="fas fa-user"></i>
        </div>

        <h1>Contactame</h1>

        <p>
          Puedes encontrarme y contactar conmigo a traves de mis redes sociales.
        </p>

      </div>


      <div class="social-container">

        <!-- TWITTER -->
        <a
          class="social twitter"
          href="https://twitter.com/informatico__"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Twitter"
        >
          <span class="tooltip">Twitter</span>
          <span class="social-icon">
            <i class="fab fa-twitter"></i>
          </span>
        </a>


        <!-- INSTAGRAM -->
        <a
          class="social instagram"
          href="https://www.instagram.com/ivanmaartineez__/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <span class="tooltip">Instagram</span>
          <span class="social-icon">
            <i class="fab fa-instagram"></i>
          </span>
        </a>


        <!-- GITHUB -->
        <a
          class="social github"
          href="https://github.com/IvanMartinez77"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <span class="tooltip">GitHub</span>
          <span class="social-icon">
            <i class="fab fa-github"></i>
          </span>
        </a>

      </div>


      <div class="contact-message">

        <i class="fas fa-code"></i>

        <span>
          Desarrollador · Informatica · Tecnologia
        </span>

      </div>

    </section>


    <footer>
      <p>© 2026 Ivan Martinez</p>
    </footer>

  </main>

</body>

</html>
